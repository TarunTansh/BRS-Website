<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bharat Rojgar Mahotsav registration confirmation.">
    <meta name="robots" content="noindex, nofollow">
    <title>Registration successful | Bharat Rojgar Sewa</title>
    <link rel="icon" type="image/png" href="assets/brs-only-logo.png">
    <link rel="stylesheet" href="register.css?v=2">
    <style>
        .success-shell {
            text-align: center;
        }

        .success-language-toggle {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            width: fit-content;
            margin: 0 0 24px auto;
            padding: 4px;
            border: 1px solid rgba(18, 140, 126, 0.12);
            border-radius: 999px;
            background: rgba(18, 140, 126, 0.06);
        }

        .success-language-toggle a {
            border-radius: 999px;
            padding: 8px 12px;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 800;
            text-decoration: none;
        }

        .success-language-toggle a.active {
            color: #ffffff;
            background: linear-gradient(135deg, var(--green) 0%, var(--teal) 100%);
        }

        .success-language-toggle a:hover {
            color: var(--teal);
        }

        .success-language-toggle a.active:hover {
            color: #ffffff;
        }

        .success-mark {
            display: grid;
            place-items: center;
            width: 76px;
            height: 76px;
            margin: 0 auto 24px;
            border-radius: 50%;
            color: #ffffff;
            background: linear-gradient(135deg, #25d366, #128c7e);
            box-shadow: 0 12px 28px rgba(18, 140, 126, 0.24);
            font-size: 2.4rem;
            font-weight: 800;
        }

        .success-shell h1 {
            margin-bottom: 12px;
        }

        .success-message {
            max-width: 520px;
            margin: 0 auto 24px;
            color: var(--muted);
            font-size: 1.08rem;
            line-height: 1.7;
        }

        .success-event {
            margin: 0 auto 28px;
            padding: 14px 16px;
            border-left: 4px solid var(--green);
            border-radius: 10px;
            background: #effaf2;
            font-weight: 800;
        }

        .success-home-link {
            display: inline-flex;
            justify-content: center;
            min-width: 220px;
            padding: 14px 20px;
            border-radius: 12px;
            color: #ffffff;
            background: linear-gradient(135deg, var(--green), var(--teal));
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(18, 140, 126, 0.2);
        }

        @media (max-width: 620px) {
            .success-mark {
                width: 68px;
                height: 68px;
                margin-bottom: 20px;
            }

            .success-message {
                font-size: 1rem;
            }

            .success-home-link {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="registration-page">
        <section class="registration-shell success-shell" aria-labelledby="successTitle">
            <div class="success-language-toggle">
                <a id="englishToggle" href="?lang=en">EN</a>
                <a id="hindiToggle" href="?lang=hi">HI</a>
            </div>
            <div class="success-mark" aria-hidden="true">&#10003;</div>
            <div class="brand-row">
                <img src="assets/brs-only-logo.png" alt="Bharat Rojgar Sewa logo" class="brand-logo">
                <span>Bharat Rojgar Sewa</span>
            </div>
            <p id="successEyebrow" class="eyebrow">Bharat Rojgar Mahotsav</p>
            <h1 id="successTitle">Registration successful!</h1>
            <p id="successMessage" class="success-message">Your registration is complete. Your attendance has been marked.</p>
            <div id="successEvent" class="success-event" hidden></div>
            <a id="homeLink" class="success-home-link" href="/">Go to homepage</a>
        </section>
    </main>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const eventCity = (params.get('event_city') || '').trim().toLowerCase();
            const language = params.get('lang') === 'hi' ? 'hi' : 'en';
            const eventSummary = document.getElementById('successEvent');
            const translations = {
                en: {
                    title: 'Registration successful!',
                    message: 'Your registration is complete. Your attendance has been marked.',
                    eyebrow: 'Bharat Rojgar Mahotsav',
                    event: 'Bharat Rojgar Mahotsav | {city} Edition',
                    home: 'Go to homepage',
                    languageLink: 'हिंदी',
                    documentTitle: 'Registration successful | Bharat Rojgar Sewa'
                },
                hi: {
                    title: 'पंजीकरण सफल!',
                    message: 'आपका पंजीकरण सफलतापूर्वक पूरा हो गया है। आपकी उपस्थिति दर्ज कर दी गई है।',
                    eyebrow: 'भारत रोजगार महोत्सव',
                    event: 'भारत रोजगार महोत्सव | {city} संस्करण',
                    home: 'होम पेज पर जाएं',
                    languageLink: 'English',
                    documentTitle: 'पंजीकरण सफल | Bharat Rojgar Sewa'
                }
            };
            const text = translations[language];
            const displayCity = eventCity ? eventCity.charAt(0).toUpperCase() + eventCity.slice(1) : '';

            document.documentElement.lang = language;
            document.title = text.documentTitle;
            document.getElementById('successEyebrow').textContent = text.eyebrow;
            document.getElementById('successTitle').textContent = text.title;
            document.getElementById('successMessage').textContent = text.message;
            document.getElementById('homeLink').textContent = text.home;

            const languageQuery = `event_city=${encodeURIComponent(eventCity)}&event_key=${encodeURIComponent(params.get('event_key') || '')}`;
            const englishToggle = document.getElementById('englishToggle');
            const hindiToggle = document.getElementById('hindiToggle');
            englishToggle.href = `registration-success.html?${languageQuery}&lang=en`;
            hindiToggle.href = `registration-success.html?${languageQuery}&lang=hi`;
            englishToggle.classList.toggle('active', language === 'en');
            hindiToggle.classList.toggle('active', language === 'hi');

            if (eventCity) {
                eventSummary.textContent = text.event.replace('{city}', displayCity);
                eventSummary.hidden = false;
            }
        })();
    </script>
</body>
</html>
