<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bharat Rojgar Mahotsav registration confirmation.">
    <meta name="robots" content="noindex, nofollow">
    <title>पंजीकरण सफल | Bharat Rojgar Sewa</title>
    <link rel="icon" type="image/png" href="assets/brs-only-logo.png">
    <link rel="stylesheet" href="register.css?v=2">
    <style>
        .success-shell {
            text-align: center;
        }

        .success-mark {
            display: grid;
            place-items: center;
            width: 76px;
            height: 76px;
            margin: 0 auto 24px;
            border-radius: 50%;
            color: #ffffff;
            background: linear-gradient(135deg, #25d366, #128c7e);
            box-shadow: 0 12px 28px rgba(18, 140, 126, 0.24);
            font-size: 2.4rem;
            font-weight: 800;
        }

        .success-shell h1 {
            margin-bottom: 12px;
        }

        .success-message {
            max-width: 520px;
            margin: 0 auto 24px;
            color: var(--muted);
            font-size: 1.08rem;
            line-height: 1.7;
        }

        .success-event {
            margin: 0 auto 28px;
            padding: 14px 16px;
            border-left: 4px solid var(--green);
            border-radius: 10px;
            background: #effaf2;
            font-weight: 800;
        }

        .success-home-link {
            display: inline-flex;
            justify-content: center;
            min-width: 220px;
            padding: 14px 20px;
            border-radius: 12px;
            color: #ffffff;
            background: linear-gradient(135deg, var(--green), var(--teal));
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(18, 140, 126, 0.2);
        }

        @media (max-width: 620px) {
            .success-mark {
                width: 68px;
                height: 68px;
                margin-bottom: 20px;
            }

            .success-message {
                font-size: 1rem;
            }

            .success-home-link {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="registration-page">
        <section class="registration-shell success-shell" aria-labelledby="successTitle">
            <div class="success-mark" aria-hidden="true">&#10003;</div>
            <div class="brand-row">
                <img src="assets/brs-only-logo.png" alt="Bharat Rojgar Sewa logo" class="brand-logo">
                <span>Bharat Rojgar Sewa</span>
            </div>
            <p class="eyebrow">Bharat Rojgar Mahotsav</p>
            <h1 id="successTitle">पंजीकरण सफल!</h1>
            <p class="success-message">आपका पंजीकरण सफलतापूर्वक पूरा हो गया है। आपकी उपस्थिति दर्ज कर दी गई है।</p>
            <div id="successEvent" class="success-event" hidden></div>
            <a class="success-home-link" href="/">होम पेज पर जाएं</a>
        </section>
    </main>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const eventCity = (params.get('event_city') || '').trim().toLowerCase();
            const eventSummary = document.getElementById('successEvent');

            if (eventCity) {
                const displayCity = eventCity.charAt(0).toUpperCase() + eventCity.slice(1);
                eventSummary.textContent = `भारत रोजगार महोत्सव | ${displayCity} संस्करण`;
                eventSummary.hidden = false;
            }
        })();
    </script>
</body>
</html>
